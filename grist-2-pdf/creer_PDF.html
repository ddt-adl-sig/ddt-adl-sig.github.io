<html>
<head>
	<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
	<!--link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"-->
	<style> p { margin:0 } </style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<input id="button_process" type="button" value="Créer le PDF" onclick="creerPDF()"/>
<span id="journal"></span>


<div id="document" style="padding:1em"></div>


<script> var Document = '';

grist.ready({ requiredAccess:'read table',
	/* Permet au user de désigner la colonne avec le code Insee des communes : */
	columns: [ { name:'document', title:"Document à convertir", description:"Choisir la colonne avec le contenu du document"} ]
});

DOCU = document.getElementById("document");
JOURNAL = document.getElementById("journal");

grist.onRecord( async (record, mappings) => {
	if( mappings && mappings.document ){
		DOCU.innerHTML = record[mappings.document];
	} else {
		JOURNAL.innerHTML = "La colonne avec le document est absente !";
		return;
	}
});



let currentData = { data:'', filename:'' , config_pdf: {} };
//currentData.data = document.getElementById("document").innerHTML;
currentData.filename = "fichier.pdf"
// html2pdf config:
let config_pdf = { 
	filename: "fichier.pdf",
	pagebreak: { after: ".pagebreak"},
	jsPDF: { compress: true },
	margin: 10,
	image: { type: "png", quality: 1.0 },
	html2canvas: { scale: window.devicePixelRatio * 2, allowTaint: true, useCORS: true }
};

function creerPDF(){
	console.log("--- creerPDF()...");
	JOURNAL.innerHTML = "--- creerPDF()..."
	try {
		let docElem = document.querySelector("#document");
		let pagebreakElements = docElem.querySelectorAll(config_pdf.pagebreak.after);
		for( const pagebreakElem of pagebreakElements ){ pagebreakElem.style.display = "none" }
		html2pdf( document.querySelector("#document"), config_pdf ).then( function(){
			for( const pagebreakElem of pagebreakElements ){
				pagebreakElem.style.display = "revert";
			}
		});
		console.log("--- Processing done. Offering up the file for download!");
		JOURNAL.innerHTML = "Le PDF a été créé. Vous pouvez l'enregistrer."
	} catch( err ){
		console.error("--- Processing error:", err);
		JOURNAL.innerHTML = err
	}
}
</script>

</body>
</html>
