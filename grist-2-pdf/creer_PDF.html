<html>
<head>
	<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
	<style> #docu { margin: initial; padding: initial; border: initial; box-sizing: initial; display: block; }
	</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.14.0/html2pdf.bundle.min.js" integrity="sha512-+9GoO5OUX2MmPRHUH5dnOY+KGReMLcxywEvQxvAI0y5JxXh/lkz99dKj4xdYfODP3dMFsoZRz4CF/vHcaqa2Ag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body style="padding:1em">

<input id="button_process" type="button" value="Créer le PDF" onclick="creerPDF()"/>
<span id="journal"></span>


<div id="docu"></div>


<script>
grist.ready({ requiredAccess:'read table',
	/* Permet au user de désigner la colonne avec le contenu du document et le nom du fichier PDF : */
	columns: [
	 { name:'document', title:"Document à convertir", description:"Choisir la colonne avec le contenu du document"},
	 { name:'nomFichier', title:"Nom du fichier PDF", description:"Choisir la colonne avec le nom du fichier à créer"}
	]
});

const DOCU = document.getElementById("docu");
const JOURNAL = document.getElementById("journal");
var nomFichier = 'fichier.pdf';

let config_pdf = { // html2pdf config
	filename: nomFichier,
	pagebreak: { after: ".pagebreak"},
	jsPDF: { unit:'mm', format:'A4', orientation:'portrait', compress:true },
	margin: 20,
	image: { type:"jpeg", quality: 0.9 },
	html2canvas: { scale: window.devicePixelRatio * 2, allowTaint: true, useCORS: true }
};


grist.onRecord( async (record, mappings) => {
	if( mappings && mappings.document ){
		DOCU.innerHTML = record[mappings.document];
		if( mappings.nomFichier ){
			let nomfic = record[mappings.nomFichier];
			if( !nomfic.endsWith('.pdf') && !nomfic.endsWith('.PDF') ) nomfic += '.pdf'
			config_pdf.filename = nomfic
		}
	} else {
		JOURNAL.innerHTML = "Il faut choisir la colonne qui contient le document !";
		return;
	}
});


function creerPDF(){
	console.log("--- creerPDF()...");
	JOURNAL.innerHTML = "--- Création du PDF en cours..."
	try {
		let docElem = document.querySelector("#docu");
		let pagebreakElements = docElem.querySelectorAll(config_pdf.pagebreak.after);
		for( const pagebreakElem of pagebreakElements ){ pagebreakElem.style.display = "none" }
		html2pdf( document.querySelector("#docu"), config_pdf ).then( function(){
			for( const pagebreakElem of pagebreakElements ){
				pagebreakElem.style.display = "revert";
			}
		});
		console.log("--- Processing done. Offering up the file for download!");
		JOURNAL.innerHTML = "Le PDF a été créé. Vous pouvez l'enregistrer."
	} catch( err ){
		console.error("--- Processing error:", err);
		JOURNAL.innerHTML = err
	}
}
</script>

</body>
</html>
